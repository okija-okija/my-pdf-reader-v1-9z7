<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart PDF TTS Reader v16 (Instant & Mobile Robust)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192">
    
    <style>
        :root { --primary: #007AFF; --danger: #ff3b30; --success: #34c759; --dark: #1c1c1e; --panel-bg: rgba(255,255,255,0.95); }
        
        body { 
            margin: 0; padding: 0;
            display: flex; flex-direction: column; 
            height: 100dvh; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #e5e5ea; 
            overflow: hidden; 
            overscroll-behavior: none;
            position: fixed; width: 100%;
        }
        
        header { 
            padding: 0 15px; background: white; border-bottom: 1px solid #c6c6c8;
            display: flex; justify-content: space-between; align-items: center; 
            z-index: 100; height: 50px; flex-shrink: 0;
        }
        h1 { margin: 0; font-size: 1rem; color: var(--dark); display: flex; align-items: center; gap: 8px; }
        .icon-btn { background: none; border: none; font-size: 1.2rem; color: var(--primary); cursor: pointer; padding: 8px; }

        #viewer-container { 
            flex: 1; position: relative; background: #d1d1d6; 
            overflow: auto; 
            -webkit-overflow-scrolling: touch;
            display: flex; flex-direction: column; align-items: center;
            padding-bottom: 160px; 
            outline: none;
        }

        #zoom-wrapper {
            transform-origin: top center; 
            padding: 20px; display: flex; flex-direction: column; gap: 15px; box-sizing: border-box;
        }

        /* 縦モード */
        #viewer-container.mode-vertical { flex-direction: column; overflow-y: scroll; overflow-x: hidden; }
        #viewer-container.mode-vertical #zoom-wrapper { flex-direction: column; align-items: center; width: 100%; transform-origin: top center; }
        
        /* 横モード */
        #viewer-container.mode-horizontal-ltr { 
            flex-direction: row; 
            overflow-x: scroll; overflow-y: auto; 
            align-items: flex-start; 
            scroll-snap-type: x mandatory; 
        }
        #viewer-container.mode-horizontal-ltr #zoom-wrapper { 
            flex-direction: row; height: 100%; 
            transform-origin: left top; 
            padding: 20px 50vw 20px 20px; 
        }
        
        #viewer-container.mode-horizontal-rtl { 
            flex-direction: row-reverse; 
            overflow-x: scroll; overflow-y: auto; 
            align-items: flex-start; 
            scroll-snap-type: x mandatory; 
        }
        #viewer-container.mode-horizontal-rtl #zoom-wrapper { 
            flex-direction: row-reverse; height: 100%; 
            transform-origin: right top; 
            padding: 20px 20px 20px 50vw; 
        }

        .page-wrapper { 
            position: relative; background: white; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
            flex-shrink: 0; 
            scroll-snap-align: center; 
            scroll-snap-stop: always;
        }
        .page-wrapper canvas { display: block; width: 100%; height: auto; }
        
        .text-layer { position: absolute; left: 0; top: 0; right: 0; bottom: 0; line-height: 1.0; pointer-events: none; }
        .text-layer span { color: transparent; position: absolute; white-space: pre; cursor: pointer; transform-origin: 0% 0%; pointer-events: auto; }
        .highlight-sentence { background-color: rgba(255, 235, 59, 0.4); box-shadow: 0 0 0 3px rgba(255, 235, 59, 0.4); border-radius: 4px; mix-blend-mode: multiply; }

        /* エディタ類 */
        #mask-editor-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2000; display: none; background: rgba(0,0,0,0.85);
            flex-direction: column; align-items: center; justify-content: center;
        }
        #editor-canvas-container { position: relative; background: white; max-height: 80vh; max-width: 95vw; overflow: hidden; box-shadow: 0 0 30px black; }
        #editor-canvas-container canvas { max-height: 80vh; max-width: 95vw; display: block; width: auto; height: auto; }
        
        .editor-mask { position: absolute; background: rgba(255, 0, 0, 0.3); pointer-events: none; }
        #editor-mask-top { top: 0; left: 0; width: 100%; border-bottom: 1px solid red; }
        #editor-mask-bottom { bottom: 0; left: 0; width: 100%; border-top: 1px solid red; }
        #editor-mask-left { top: 0; left: 0; height: 100%; border-right: 1px solid red; }
        #editor-mask-right { top: 0; right: 0; height: 100%; border-left: 1px solid red; }

        #editor-drag-surface { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
        .editor-label { position: absolute; background: red; color: white; padding: 2px 8px; font-size: 11px; border-radius: 4px; pointer-events: none; white-space: nowrap; }

        /* フッター */
        footer {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--panel-bg); backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0,0,0,0.1); padding: 15px 15px 25px 15px; z-index: 200;
            display: flex; flex-direction: column; gap: 15px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); box-sizing: border-box;
        }
        .progress-bar { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: #555; }
        input[type="range"] { flex: 1; accent-color: var(--primary); cursor: pointer; }
        .main-controls { display: flex; justify-content: center; align-items: center; gap: 20px; }
        .ctrl-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: #e5e5ea; color: var(--dark); font-size: 1.2rem; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.1s; }
        .ctrl-btn:active { transform: scale(0.9); }
        
        .play-btn { width: 64px; height: 64px; background: var(--primary); color: white; font-size: 1.5rem; box-shadow: 0 4px 10px rgba(0,122,255,0.3); transition: all 0.3s; display: flex; align-items: center; justify-content: center; }
        
        @keyframes pulse-animation { 0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(255, 59, 48, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); } }
        .play-btn.playing { background-color: var(--danger); animation: pulse-animation 2s infinite; }
        .play-btn.step-mode { background-color: var(--success); }
        .play-btn.step-mode:active { transform: rotate(180deg); transition: transform 0.3s; }

        .mode-icon { display: none; }
        .btn-state-continuous.paused .fa-play { display: inline-block; padding-left: 4px; }
        .btn-state-continuous.playing .fa-stop { display: inline-block; }
        .btn-state-step .fa-sync-alt { display: inline-block; }

        /* 設定メニュー */
        #settings-panel {
            position: fixed; top: 0; right: 0; width: 300px; height: 100%;
            background: white; box-shadow: -5px 0 15px rgba(0,0,0,0.1);
            z-index: 300; transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 20px; box-sizing: border-box; overflow-y: auto;
        }
        #settings-panel.open { transform: translateX(0); }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3); z-index: 299; display: none; opacity: 0; transition: opacity 0.3s;
        }
        #overlay.show { display: block; opacity: 1; }

        .setting-group { margin-bottom: 25px; }
        .setting-label { font-size: 0.9rem; font-weight: bold; color: #333; margin-bottom: 8px; display: block; }
        .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 0.85rem; }
        select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ddd; background: #f9f9f9; }
        .action-btn { display: block; width: 100%; padding: 12px; background: var(--primary); color: white; text-align: center; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 15px; border: none; }
        .action-btn.secondary { background: #5856d6; }

        /* ローディング */
        #loading {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8); color: white; padding: 20px 40px; border-radius: 12px;
            z-index: 999; display: none; flex-direction: column; align-items: center;
        }
        .spinner { width: 30px; height: 30px; border: 3px solid #fff; border-top: 3px solid var(--primary); border-radius: 50%; animation: spin 1s infinite linear; margin-bottom: 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loading"><div class="spinner"></div><span id="loading-msg">Loading...</span></div>
<div id="overlay"></div>

<div id="mask-editor-overlay">
    <div style="color:white; margin-bottom:15px; text-align:center;">
        <h3 style="margin:0">読まない範囲を指定</h3>
        <p style="font-size:12px; opacity:0.8; margin-top:5px;">画面上の調整したい端をドラッグしてください</p>
    </div>
    <div id="editor-canvas-container">
        <canvas id="editor-canvas"></canvas>
        <div id="editor-mask-top" class="editor-mask"><span class="editor-label" style="bottom:2px; left:50%; transform:translateX(-50%)">上部</span></div>
        <div id="editor-mask-bottom" class="editor-mask"><span class="editor-label" style="top:2px; left:50%; transform:translateX(-50%)">下部</span></div>
        <div id="editor-mask-left" class="editor-mask"><span class="editor-label" style="top:50%; right:2px; transform:translateY(-50%)">左</span></div>
        <div id="editor-mask-right" class="editor-mask"><span class="editor-label" style="top:50%; left:2px; transform:translateY(-50%)">右</span></div>
        <div id="editor-drag-surface"></div>
    </div>
    <div style="margin-top:20px; display:flex; gap:10px;">
        <button class="action-btn" id="mask-save-btn" style="width:120px">保存</button>
        <button class="action-btn" id="mask-cancel-btn" style="width:120px; background:#666;">キャンセル</button>
    </div>
</div>

<header>
    <h1><i class="fas fa-book-reader"></i> Smart PDF v16</h1>
    <button class="icon-btn" id="menu-btn"><i class="fas fa-bars"></i></button>
</header>

<div id="settings-panel">
    <h2 style="margin-top:0; font-size:1.2rem;">設定</h2>
    
    <label class="action-btn">
        <i class="fas fa-folder-open"></i> PDFファイルを選択
        <input type="file" id="file-input" accept="application/pdf" style="display:none">
    </label>

    <div class="setting-group">
        <span class="setting-label">表示モード</span>
        <select id="view-mode-select">
            <option value="vertical">縦スクロール (標準)</option>
            <option value="horizontal-ltr">横スクロール (左→右)</option>
            <option value="horizontal-rtl">横スクロール (右→左 / 日本語)</option>
        </select>
    </div>
    
    <div class="setting-group">
        <span class="setting-label">読み上げモード</span>
        <select id="read-mode-select">
            <option value="continuous">連続読み上げ (標準)</option>
            <option value="step">一文ずつ読む (手動送り)</option>
        </select>
    </div>

    <div class="setting-group">
        <span class="setting-label">PDF描画クオリティ</span>
        <select id="quality-select">
            <option value="1.0">1.0 (低画質・高速)</option>
            <option value="1.5">1.5 (バランス)</option>
            <option value="2.0" selected>2.0 (標準・推奨)</option>
            <option value="3.0">3.0 (高画質・重い)</option>
        </select>
    </div>

    <div class="setting-group">
        <span class="setting-label">音声選択</span>
        <select id="voice-select"><option>読み込み中...</option></select>
    </div>

    <div class="setting-group">
        <div class="setting-row">
            <span class="setting-label">速度</span>
            <span id="rate-val">1.5x</span>
        </div>
        <input type="range" id="rate-range" min="0.5" max="3.0" step="0.1" value="1.5" style="width:100%">
    </div>

    <div class="setting-group">
        <div class="setting-row">
            <span class="setting-label">表示ズーム</span>
            <span id="zoom-val">100%</span>
        </div>
        <input type="range" id="zoom-range" min="50" max="300" step="10" value="100" style="width:100%">
    </div>

    <hr style="border:0; border-top:1px solid #eee; margin: 20px 0;">

    <div class="setting-group">
        <span class="setting-label" style="color:#e74c3c">読まない範囲（余白カット）</span>
        
        <button class="action-btn secondary" id="visual-mask-btn">
            <i class="fas fa-crop-alt"></i> 現在のページで範囲指定
        </button>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div><div class="setting-row"><span style="font-size:0.75rem">上部(%)</span><span id="cut-top-val">0</span></div><input type="range" id="cut-top-range" min="0" max="40" value="0" style="width:100%"></div>
            <div><div class="setting-row"><span style="font-size:0.75rem">下部(%)</span><span id="cut-bottom-val">0</span></div><input type="range" id="cut-bottom-range" min="0" max="40" value="0" style="width:100%"></div>
            <div><div class="setting-row"><span style="font-size:0.75rem">左端(%)</span><span id="cut-left-val">0</span></div><input type="range" id="cut-left-range" min="0" max="30" value="0" style="width:100%"></div>
            <div><div class="setting-row"><span style="font-size:0.75rem">右端(%)</span><span id="cut-right-val">0</span></div><input type="range" id="cut-right-range" min="0" max="30" value="0" style="width:100%"></div>
        </div>
    </div>
</div>

<main id="viewer-container" class="mode-vertical" tabindex="0">
    <div id="zoom-wrapper">
        <div id="viewer" style="display:contents;"></div>
    </div>
</main>

<footer>
    <div class="progress-bar">
        <span id="page-current">1</span>
        <input type="range" id="page-slider" min="1" max="1" value="1">
        <span id="page-total">1</span>
    </div>
    <div class="main-controls">
        <button class="ctrl-btn" id="prev-page-btn"><i class="fas fa-step-backward"></i></button>
        <button class="ctrl-btn" id="prev-sent-btn"><i class="fas fa-backward"></i></button>
        
        <button class="ctrl-btn play-btn btn-state-continuous paused" id="play-btn">
            <i class="fas fa-play mode-icon"></i>
            <i class="fas fa-stop mode-icon"></i>
            <i class="fas fa-sync-alt mode-icon"></i>
        </button>
        
        <button class="ctrl-btn" id="next-sent-btn"><i class="fas fa-forward"></i></button>
        <button class="ctrl-btn" id="next-page-btn"><i class="fas fa-step-forward"></i></button>
    </div>
</footer>

<script type="module">

    // サービスワーカーの登録
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('PWA ServiceWorker registered'))
                .catch(err => console.log('PWA ServiceWorker registration failed', err));
        });
    }


    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs';

    const synth = window.speechSynthesis;
    window.currentUtterance = null;

    let pdfDoc = null;
    let state = {
        isReading: false,
        pageIndex: 0,
        sentIndex: 0,
        totalPages: 0,
        zoom: 1.0,
        renderScale: 2.0, 
        cutTopPercent: 0,    
        cutBottomPercent: 0,
        cutLeftPercent: 0,
        cutRightPercent: 0,
        sessionId: 0,
        viewMode: 'vertical',
        readMode: 'continuous' 
    };
    let pagesData = []; 

    const menuBtn = document.getElementById('menu-btn');
    const settingsPanel = document.getElementById('settings-panel');
    const overlay = document.getElementById('overlay');
    const viewerContainer = document.getElementById('viewer-container');
    const zoomWrapper = document.getElementById('zoom-wrapper');
    const playBtn = document.getElementById('play-btn');

    function toggleMenu(show) {
        if(show) { settingsPanel.classList.add('open'); overlay.classList.add('show'); } 
        else { settingsPanel.classList.remove('open'); overlay.classList.remove('show'); }
    }
    menuBtn.onclick = () => toggleMenu(true);
    overlay.onclick = () => toggleMenu(false);

    const readModeSelect = document.getElementById('read-mode-select');
    readModeSelect.onchange = (e) => {
        state.readMode = e.target.value;
        stopReading();
        updatePlayButtonIcon();
    };

    function updatePlayButtonIcon() {
        playBtn.className = 'ctrl-btn play-btn';
        if (state.readMode === 'step') {
            playBtn.classList.add('btn-state-step');
            playBtn.classList.add('step-mode');
        } else {
            playBtn.classList.add('btn-state-continuous');
            if (state.isReading) playBtn.classList.add('playing');
            else playBtn.classList.add('paused');
        }
    }

    const qualitySelect = document.getElementById('quality-select');
    qualitySelect.onchange = (e) => {
        state.renderScale = parseFloat(e.target.value);
        if(pdfDoc) {
            pagesData.forEach(p => { p.rendered = false; });
            document.getElementById('viewer').innerHTML = ''; 
            createPageElements(); 
            updateVisiblePages(); 
        }
    };

    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

        if (e.code === 'Space') {
            e.preventDefault();
            playBtn.click();
            return;
        }
        if (e.code === 'ArrowRight') {
            e.preventDefault();
            skipSent(1);
        } else if (e.code === 'ArrowLeft') {
            e.preventDefault();
            skipSent(-1);
        } else if (state.readMode === 'step' && (e.code === 'ArrowUp' || e.code === 'ArrowDown')) {
            e.preventDefault();
            readFrom(state.pageIndex, state.sentIndex);
        }
    });

    const zoomRange = document.getElementById('zoom-range');
    const zoomVal = document.getElementById('zoom-val');
    
    zoomRange.oninput = (e) => {
        applyZoom(e.target.value / 100);
    };

    function applyZoom(newZoom) {
        state.zoom = newZoom;
        const val = Math.round(newZoom * 100);
        zoomVal.textContent = val + '%';
        zoomRange.value = val;

        const oldScrollTop = viewerContainer.scrollTop;
        const scrollHeight = viewerContainer.scrollHeight - viewerContainer.clientHeight;
        const ratio = (scrollHeight > 0) ? oldScrollTop / scrollHeight : 0;

        zoomWrapper.style.transform = `scale(${state.zoom})`;

        requestAnimationFrame(() => {
            const newScrollHeight = viewerContainer.scrollHeight - viewerContainer.clientHeight;
            if(newScrollHeight > 0) viewerContainer.scrollTop = newScrollHeight * ratio;
        });
    }

    // マスクエディタ
    const visualMaskBtn = document.getElementById('visual-mask-btn');
    const maskOverlay = document.getElementById('mask-editor-overlay');
    const editorCanvas = document.getElementById('editor-canvas');
    const editorDragSurface = document.getElementById('editor-drag-surface');
    const editorMasks = {
        top: document.getElementById('editor-mask-top'),
        bottom: document.getElementById('editor-mask-bottom'),
        left: document.getElementById('editor-mask-left'),
        right: document.getElementById('editor-mask-right')
    };

    let tempCuts = { top: 0, bottom: 0, left: 0, right: 0 };
    let activeDragEdge = null; 

    visualMaskBtn.onclick = async () => {
        if(!pdfDoc) return alert("PDFを先に読み込んでください");
        toggleMenu(false);
        showLoading("プレビュー作成中...");
        try {
            const page = await pdfDoc.getPage(state.pageIndex + 1);
            const viewport = page.getViewport({ scale: 1.0 });
            editorCanvas.width = viewport.width;
            editorCanvas.height = viewport.height;
            await page.render({ canvasContext: editorCanvas.getContext('2d'), viewport }).promise;
            
            tempCuts.top = state.cutTopPercent; tempCuts.bottom = state.cutBottomPercent;
            tempCuts.left = state.cutLeftPercent; tempCuts.right = state.cutRightPercent;
            updateEditorUI();
            maskOverlay.style.display = 'flex';
            hideLoading();
        } catch(e) { console.error(e); hideLoading(); alert("エラー"); }
    };

    function updateEditorUI() {
        editorMasks.top.style.height = tempCuts.top + '%';
        editorMasks.bottom.style.height = tempCuts.bottom + '%';
        editorMasks.left.style.width = tempCuts.left + '%';
        editorMasks.right.style.width = tempCuts.right + '%';
    }

    function handleDragStart(xPct, yPct) {
        const dTop = Math.abs(yPct - tempCuts.top);
        const dBot = Math.abs(yPct - (100 - tempCuts.bottom));
        const dLeft = Math.abs(xPct - tempCuts.left);
        const dRight = Math.abs(xPct - (100 - tempCuts.right));
        const min = Math.min(dTop, dBot, dLeft, dRight);
        if (min === dTop) activeDragEdge = 'top'; else if (min === dBot) activeDragEdge = 'bottom';
        else if (min === dLeft) activeDragEdge = 'left'; else activeDragEdge = 'right';
    }
    function handleDragMove(xPct, yPct) {
        if (!activeDragEdge) return;
        if (activeDragEdge === 'top') tempCuts.top = Math.max(0, Math.min(45, yPct));
        else if (activeDragEdge === 'bottom') tempCuts.bottom = Math.max(0, Math.min(45, 100 - yPct));
        else if (activeDragEdge === 'left') tempCuts.left = Math.max(0, Math.min(45, xPct));
        else if (activeDragEdge === 'right') tempCuts.right = Math.max(0, Math.min(45, 100 - xPct));
        updateEditorUI();
    }
    editorDragSurface.onmousedown = (e) => {
        const r = editorDragSurface.getBoundingClientRect();
        const getP = (ev) => ({ x: ((ev.clientX-r.left)/r.width)*100, y: ((ev.clientY-r.top)/r.height)*100 });
        const p = getP(e); handleDragStart(p.x, p.y);
        const mv = (me) => { const mp = getP(me); handleDragMove(mp.x, mp.y); };
        const up = () => { activeDragEdge = null; window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); };
        window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up);
    };
    editorDragSurface.ontouchstart = (e) => {
        e.preventDefault(); const r = editorDragSurface.getBoundingClientRect();
        const getP = (ev) => ({ x: ((ev.touches[0].clientX-r.left)/r.width)*100, y: ((ev.touches[0].clientY-r.top)/r.height)*100 });
        const p = getP(e); handleDragStart(p.x, p.y);
        const mv = (me) => { const mp = getP(me); handleDragMove(mp.x, mp.y); };
        const up = () => { activeDragEdge = null; window.removeEventListener('touchmove', mv); window.removeEventListener('touchend', up); };
        window.addEventListener('touchmove', mv, {passive:false}); window.addEventListener('touchend', up);
    };

    document.getElementById('mask-save-btn').onclick = () => {
        state.cutTopPercent = Math.round(tempCuts.top); state.cutBottomPercent = Math.round(tempCuts.bottom);
        state.cutLeftPercent = Math.round(tempCuts.left); state.cutRightPercent = Math.round(tempCuts.right);
        maskOverlay.style.display = 'none'; updateCutVisuals(); reloadTextData();
    };
    document.getElementById('mask-cancel-btn').onclick = () => maskOverlay.style.display = 'none';

    const ranges = { top: document.getElementById('cut-top-range'), bottom: document.getElementById('cut-bottom-range'), left: document.getElementById('cut-left-range'), right: document.getElementById('cut-right-range') };
    
    function updateCutVisuals() {
        document.getElementById('cut-top-val').textContent = state.cutTopPercent; ranges.top.value = state.cutTopPercent;
        document.getElementById('cut-bottom-val').textContent = state.cutBottomPercent; ranges.bottom.value = state.cutBottomPercent;
        document.getElementById('cut-left-val').textContent = state.cutLeftPercent; ranges.left.value = state.cutLeftPercent;
        document.getElementById('cut-right-val').textContent = state.cutRightPercent; ranges.right.value = state.cutRightPercent;
    }
    ['top','bottom','left','right'].forEach(k => ranges[k].oninput = (e) => { state[`cut${k.charAt(0).toUpperCase()+k.slice(1)}Percent`] = parseInt(e.target.value); updateCutVisuals(); });
    ['top','bottom','left','right'].forEach(k => ranges[k].onchange = reloadTextData);

    function reloadTextData() {
        if(pdfDoc) {
            pagesData.forEach(p => { p.sentences = null; });
            if(state.isReading) stopReading();
            renderPageContent(state.pageIndex, true); 
        }
    }

    document.getElementById('file-input').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        toggleMenu(false);
        stopReading();
        document.getElementById('viewer').innerHTML = '';
        pagesData = [];
        state.pageIndex = 0;
        state.sentIndex = 0;

        showLoading("PDF解析中...");
        try {
            const arrayBuffer = await file.arrayBuffer();

            // 1. バージョンを明示的に指定（ライブラリ本体と合わせる）
            const PDFJS_VERSION = '4.0.379'; 
            
            // 2. CMapと標準フォントの参照先を unpkg に変更（CORS制限が緩いため）
            const CMAP_URL = `https://unpkg.com/pdfjs-dist@${PDFJS_VERSION}/cmaps/`;
            const CMAP_PACKED = true;
            const STANDARD_FONT_URL = `https://unpkg.com/pdfjs-dist@${PDFJS_VERSION}/standard_fonts/`;

            // 3. Workerのソースも一貫性を持たせる（任意ですが推奨）
            // pdfjsLib.GlobalWorkerOptions.workerSrc = `https://unpkg.com/pdfjs-dist@${PDFJS_VERSION}/build/pdf.worker.min.mjs`;

            pdfDoc = await pdfjsLib.getDocument({
                data: arrayBuffer,
                cMapUrl: CMAP_URL, 
                cMapPacked: CMAP_PACKED,
                standardFontDataUrl: STANDARD_FONT_URL, // これを追加
            }).promise;
            
            state.totalPages = pdfDoc.numPages;
            setupPageSlider();

            await createPageElements();

            const page1 = await pdfDoc.getPage(1);
            const vpRaw = page1.getViewport({scale: 1.0});
            const availableH = window.innerHeight - 220; 
            const optimalZoom = availableH / vpRaw.height;
            const safeZoom = Math.min(Math.max(optimalZoom, 0.5), 3.0);
            applyZoom(safeZoom);

            updateVisiblePages();
            hideLoading();
            warmupSpeech(); 
        } catch (err) {
            console.error("PDF読み込みエラー:", err);
            alert("エラー: " + err.message);
            hideLoading();
        }
    };

    async function createPageElements() {
        const viewer = document.getElementById('viewer');
        for (let i = 1; i <= state.totalPages; i++) {
            const page = await pdfDoc.getPage(i);
            const viewport = page.getViewport({ scale: 1.0 });

            pagesData.push({ pageObj: page, baseViewport: viewport, rawItems: null, sentences: null, rendered: false });

            const div = document.createElement('div');
            div.className = 'page-wrapper';
            div.id = `page-wrap-${i-1}`;
            div.style.width = viewport.width + 'px';
            div.style.height = viewport.height + 'px';
            div.dataset.pageIndex = i - 1;
            div.addEventListener('dblclick', handleDoubleClick);
            viewer.appendChild(div);
        }
        document.querySelectorAll('.page-wrapper').forEach(el => observer.observe(el));
    }


    async function preparePageText(idx) {
        if (!pagesData[idx]) return;
        const data = pagesData[idx];
        if (data.sentences) return;
        
        if (!data.rawItems) {
            const content = await data.pageObj.getTextContent();
            data.rawItems = content.items;
        }

        const viewport = data.baseViewport; 
        const h = viewport.height;
        const w = viewport.width;
        
        // マスク範囲の計算
        const topPx = h * (state.cutTopPercent / 100);
        const bottomPx = h * (1.0 - state.cutBottomPercent / 100);
        const leftPx = w * (state.cutLeftPercent / 100);
        const rightPx = w * (1.0 - state.cutRightPercent / 100);

        // 1. まず座標変換とフィルタリング（マスク処理）
        let items = data.rawItems.map((item, index) => {
            const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
            // PDF座標系からCanvas描画用座標系(左上原点)へ変換
            const itemY = tx[5] - item.height; 
            const itemX = tx[4];
            return { ...item, originalIndex: index, visualTop: itemY, visualLeft: itemX };
        }).filter(item => {
            // 空白文字のみのアイテムは除外
            if (!item.str.trim()) return false;
            // マスク範囲内かチェック
            return item.visualTop > topPx && item.visualTop < bottomPx &&
                   item.visualLeft > leftPx && item.visualLeft < rightPx;
        });

        // 2. index9のロジックをベースにした厳格なソート
        items.sort((a, b) => {
            // 行の高さに基づく許容誤差 (index9では height * 0.5)
            const height = a.height || 10;
            const tolerance = height * 0.5;
            
            const diffY = Math.abs(a.visualTop - b.visualTop);
            
            // 同じ行とみなす場合 (Y座標の差が許容値以内)
            if (diffY < tolerance) {
                return a.visualLeft - b.visualLeft; // 左から右へ
            }
            // 違う行の場合 (上から下へ)
            return a.visualTop - b.visualTop; 
        });

        // 3. 文章の構築（重複排除ロジックを追加）
        let sentences = [];
        let currentText = ""; 
        let currentIndices = [];
        let lastItem = null;

        items.forEach(item => {
            // index9の重複排除ロジック:
            // 前のアイテムと文字が同じで、かつ座標が極めて近い場合は二重印字とみなしてスキップ
            if (lastItem) {
                const distX = Math.abs(item.visualLeft - lastItem.visualLeft);
                const distY = Math.abs(item.visualTop - lastItem.visualTop);
                // 距離閾値は2px (index9準拠)
                if (item.str === lastItem.str && distX < 2 && distY < 2) {
                    return; 
                }
            }

            // 文章の連結
            currentText += item.str;
            currentIndices.push(item.originalIndex);
            lastItem = item;

            // 文末判定
            if (/[。！？\.?!]$/.test(item.str)) {
                sentences.push({ text: currentText, indices: [...currentIndices] });
                currentText = ""; 
                currentIndices = [];
                lastItem = null; // 文が変わったら重複チェックもリセット
            }
        });

        // 残ったテキストを追加
        if (currentText.trim()) {
            sentences.push({ text: currentText, indices: currentIndices });
        }
        
        data.sentences = sentences;
    }


    async function renderPageContent(idx, force = false) {
        if (!pagesData[idx]) return;
        const data = pagesData[idx];

        if (!data.rawItems || !data.sentences) {
            await preparePageText(idx);
        }

        if (data.rendered && !force) return;
        data.rendered = true;

        const wrapper = document.getElementById(`page-wrap-${idx}`);
        if (!wrapper) return; 

        let canvas = wrapper.querySelector('canvas');
        if (!canvas) {
            canvas = document.createElement('canvas');
            wrapper.appendChild(canvas);
        }
        
        const renderViewport = data.pageObj.getViewport({ scale: state.renderScale });
        canvas.width = renderViewport.width;
        canvas.height = renderViewport.height;
        canvas.style.width = data.baseViewport.width + 'px';
        canvas.style.height = data.baseViewport.height + 'px';

        const ctx = canvas.getContext('2d');
        ctx.clearRect(0,0,canvas.width,canvas.height);

        let textLayer = wrapper.querySelector('.text-layer');
        if(textLayer) textLayer.remove();
        textLayer = document.createElement('div');
        textLayer.className = 'text-layer';
        wrapper.appendChild(textLayer);

        await data.pageObj.render({ canvasContext: ctx, viewport: renderViewport }).promise;
        
        if (data.rawItems) {
            data.rawItems.forEach((item, i) => {
                const span = document.createElement('span');
                const tx = pdfjsLib.Util.transform(data.baseViewport.transform, item.transform);
                span.style.left = tx[4] + 'px'; 
                span.style.top = (tx[5] - item.height) + 'px';
                span.style.fontSize = item.height + 'px';
                span.style.fontFamily = 'sans-serif';
                span.textContent = item.str;
                span.id = `p${idx}-i${i}`;
                span.dataset.itemIndex = i;
                textLayer.appendChild(span);
            });
        }
    }

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const idx = parseInt(entry.target.dataset.pageIndex);
                renderPageContent(idx);
                if (!state.isReading) updatePageSliderVal(idx);
            }
        });
    }, { rootMargin: "200px" });

    function updateVisiblePages() { document.querySelectorAll('.page-wrapper').forEach(el => observer.observe(el)); }

    const viewModeSelect = document.getElementById('view-mode-select');
    viewModeSelect.onchange = (e) => {
        state.viewMode = e.target.value;
        viewerContainer.className = ''; viewerContainer.classList.add(`mode-${state.viewMode}`);
        if (state.viewMode === 'vertical') zoomWrapper.style.transformOrigin = 'top center';
        else if (state.viewMode === 'horizontal-rtl') zoomWrapper.style.transformOrigin = 'right top';
        else zoomWrapper.style.transformOrigin = 'left top';
        setTimeout(() => scrollToPage(state.pageIndex), 100);
    };

    // TTSウォームアップ (アイドル時に定期実行)
    setInterval(() => {
        if (!state.isReading && !synth.speaking) {
            warmupSpeech();
        }
    }, 20000);

    function warmupSpeech() { 
        const u = new SpeechSynthesisUtterance("\u200B"); 
        u.volume = 0;
        try { synth.speak(u); } catch(e) { console.warn('warmup failed', e); }
    }

    
    playBtn.onclick = () => {
        if (state.readMode === 'step') {
            readFrom(state.pageIndex, state.sentIndex);
        } else {
            if(state.isReading) stopReading();
            else readFrom(state.pageIndex, state.sentIndex);
        }
    };

    function stopReading() { 
        state.isReading = false; 
        state.sessionId++; // 修正: 単純インクリメントに変更 (index9準拠)
        synth.cancel(); 
        window.currentUtterance = null;
        updatePlayButtonIcon(); 
    }
    
    async function readFrom(pIdx, sIdx) {
        state.isReading = true; 
        state.sessionId++; // 修正: 単純インクリメント
        const mySession = state.sessionId;
        
        // 修正: 待機時間なしで即座にキャンセル
        synth.cancel();
        updatePlayButtonIcon();

        loop: for (let p = pIdx; p < state.totalPages; p++) {
            if (!state.isReading || mySession !== state.sessionId) break;
            
            if (state.pageIndex !== p) {
                state.pageIndex = p; 
                updatePageSliderVal(p);
                scrollToPage(p);
            }
            
            const pageEl = document.getElementById(`page-wrap-${p}`);
            if(pageEl && !isElementInViewport(pageEl)) {
                scrollToPage(p);
            }
            
            await renderPageContent(p); 
            if (!pagesData[p]) break loop;
            
            if (!pagesData[p].sentences) await preparePageText(p);
            if (!pagesData[p].sentences || pagesData[p].sentences.length === 0) continue;

            const sentences = pagesData[p].sentences;
            let startS = (p === pIdx) ? sIdx : 0;

            for (let s = startS; s < sentences.length; s++) {
                if (!state.isReading || mySession !== state.sessionId) break loop;
                
                state.sentIndex = s;
                const indices = sentences[s].indices;
                
                let el = document.getElementById(`p${p}-i${indices[0]}`);
                // 修正: 再生前の待機も最小限に
                if (!el) {
                    await new Promise(r => setTimeout(r, 20)); // 短縮
                    el = document.getElementById(`p${p}-i${indices[0]}`);
                }

                if (el) {
                    highlight(p, indices);
                    ensureVisible(el);
                }

                await speak(sentences[s].text, mySession);

                if(state.readMode === 'step') {
                    state.isReading = false;
                    break loop;
                }
            }
        }
        if (mySession === state.sessionId && state.readMode !== 'step') stopReading();
    }

    function ensureVisible(el) {
        const opts = { behavior: 'smooth', block: 'center' };
        if (state.viewMode === 'vertical') {
            opts.inline = 'nearest'; 
        } else {
            opts.inline = 'nearest';
        }
        el.scrollIntoView(opts);
    }

    function isElementInViewport(el) {
        const rect = el.getBoundingClientRect();
        return (rect.top >= -rect.height && rect.bottom <= (window.innerHeight + rect.height)); 
    }

    function speak(text, sessId) {
        return new Promise(resolve => {
            if (!text || sessId !== state.sessionId) { resolve(); return; }

            // *** 重要: ここで synth.cancel() は行わない ***
            const u = new SpeechSynthesisUtterance(text);
            window.currentUtterance = u;

            const vVal = document.getElementById('voice-select').value;
            const voice = synth.getVoices().find(v => v.voiceURI === vVal);
            if (voice) u.voice = voice;
            u.rate = parseFloat(document.getElementById('rate-range').value);

            let ended = false;
            let recoveryTimer = null;
            let didRecoveryAttempt = false; // 再発話は1回だけ

            const onFinish = () => {
                if (ended) return;
                ended = true;
                if (recoveryTimer) { clearTimeout(recoveryTimer); recoveryTimer = null; }
                window.currentUtterance = null;
                resolve();
            };

            u.onend = onFinish;
            u.onerror = (e) => {
                // 音声エラーはログを出して終了扱いにする（必要ならここで端末別の処理）
                console.warn('Speech error', e);
                onFinish();
            };

            try {
                synth.speak(u);
            } catch (e) {
                console.warn('synth.speak failed', e);
                onFinish();
                return;
            }

            // モバイルで「突然止まる」ケースに対する単発回復試行（1回だけ）
            // 3.5秒後にまだ再生が始まっていない／止まった場合は1回だけ再発話を試みる
            recoveryTimer = setTimeout(() => {
                recoveryTimer = null;
                if (ended || sessId !== state.sessionId || !state.isReading) return;

                // 既に再生中なら何もしない
                if (synth.speaking || synth.pending) return;

                if (!didRecoveryAttempt) {
                    didRecoveryAttempt = true;
                    try {
                        // 再発話を1回だけ試みる（再帰的な無限ループ防止のためフラグ）
                        synth.speak(u);
                    } catch (err) {
                        console.warn('re-speak failed', err);
                    }
                }
            }, 3500);
        });
    }

    function handleDoubleClick(e) {
        if (e.target.tagName !== 'SPAN') return;
        const pIdx = parseInt(e.currentTarget.dataset.pageIndex);
        const iIdx = parseInt(e.target.dataset.itemIndex);
        if (!pagesData[pIdx] || !pagesData[pIdx].sentences) { 
             preparePageText(pIdx).then(() => { if(pagesData[pIdx]?.sentences) handleDoubleClick(e); }); 
             return; 
        }
        const sIdx = pagesData[pIdx].sentences.findIndex(s => s.indices.includes(iIdx));
        if (sIdx !== -1) {
            readFrom(pIdx, sIdx);
        }
    }

    document.getElementById('next-sent-btn').onclick = () => skipSent(1);
    document.getElementById('prev-sent-btn').onclick = () => skipSent(-1);
    
    function skipSent(delta) {
        // 修正: セッションID更新とキャンセルを即座に行い、readFromへ直行
        state.sessionId++;
        synth.cancel();

        let p = state.pageIndex, s = state.sentIndex + delta;
        
        if (pagesData[p] && pagesData[p].sentences) {
            const len = pagesData[p].sentences.length;
            
            if(s >= len) { 
                if (p + 1 < state.totalPages) { p++; s = 0; }
                else { return; } 
            } else if(s < 0) { 
                if (p - 1 >= 0) {
                    p--;
                    if(pagesData[p].sentences) s = pagesData[p].sentences.length - 1;
                    else s = 0;
                } else {
                    return; 
                }
            } 
            // 修正: 待機なしで呼び出し
            readFrom(p, s);
        }
    }
    
    document.getElementById('next-page-btn').onclick = () => changePage(1);
    document.getElementById('prev-page-btn').onclick = () => changePage(-1);
    function changePage(delta) {
        // 修正: 即時割り込み
        state.sessionId++;
        synth.cancel();

        let p = state.pageIndex + delta;
        if (p >= 0 && p < state.totalPages) {
            if (state.isReading && state.readMode === 'continuous') readFrom(p, 0);
            else { 
                state.pageIndex = p; state.sentIndex = 0;
                updatePageSliderVal(p); scrollToPage(p); renderPageContent(p); 
            }
        }
    }

    function highlight(pIdx, indices) {
        document.querySelectorAll('.highlight-sentence').forEach(e => e.classList.remove('highlight-sentence'));
        indices.forEach(i => { const el = document.getElementById(`p${pIdx}-i${i}`); if (el) el.classList.add('highlight-sentence'); });
    }

    function scrollToPage(pIdx) {
        const el = document.getElementById(`page-wrap-${pIdx}`);
        if(el) {
            const blockAlign = state.viewMode === 'vertical' ? 'start' : 'center';
            const inlineAlign = state.viewMode === 'vertical' ? 'center' : 'center'; 
            el.scrollIntoView({ behavior: 'auto', block: blockAlign, inline: inlineAlign });
        }
    }

    const pageSlider = document.getElementById('page-slider');
    const pageCurrent = document.getElementById('page-current');
    const pageTotal = document.getElementById('page-total');
    function setupPageSlider() {
        pageSlider.max = state.totalPages; pageTotal.textContent = state.totalPages;
        pageSlider.oninput = (e) => {
            const p = parseInt(e.target.value) - 1;
            state.pageIndex = p; pageCurrent.textContent = p + 1;
            scrollToPage(p); renderPageContent(p);
        };
    }
    function updatePageSliderVal(pIdx) { pageSlider.value = pIdx + 1; pageCurrent.textContent = pIdx + 1; }
    
    function loadVoices() {
        const vs = synth.getVoices();
        const sel = document.getElementById('voice-select');
        const filtered = vs.filter(v => v.lang.includes('ja') || v.lang.includes('en'));
        let defaultVoiceURI = "";
        const preferred = filtered.find(v => v.voiceURI === 'ja-jp-x-jab-local');
        if (preferred) defaultVoiceURI = preferred.voiceURI;
        else { const ja = filtered.find(v => v.lang.includes('ja')); if(ja) defaultVoiceURI = ja.voiceURI; }
        sel.innerHTML = filtered.sort((a,b) => a.lang.includes('ja') ? -1 : 1)
            .map(v => `<option value="${v.voiceURI}" ${v.voiceURI === defaultVoiceURI ? 'selected' : ''}>${v.name}</option>`).join('');
    }
    synth.onvoiceschanged = loadVoices; loadVoices();
    document.getElementById('rate-range').oninput = (e) => document.getElementById('rate-val').textContent = e.target.value + 'x';
    function showLoading(msg) { document.getElementById('loading-msg').textContent = msg; document.getElementById('loading').style.display = 'flex'; }
    function hideLoading() { document.getElementById('loading').style.display = 'none'; }
</script>
</body>
</html>
